<!DOCTYPE html>
<html>
<body>

<h2>Product Management</h2>

<input id="name" placeholder="Product Name">
<input id="price" placeholder="Price">
<input id="category" placeholder="Category">

<button onclick="addProduct()">Add Product</button>
<button onclick="showProducts()">Show Products</button>

<h3>Products</h3>
<div id="data"></div>

<script>
async function addProduct() {
  const product = {
    name: document.getElementById("name").value,
    price: Number(document.getElementById("price").value),
    category: document.getElementById("category").value
  };

  try {
    const response = await fetch("/products", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(product)
    });

    if (!response.ok) throw new Error("Failed to add product");

    // Clear inputs after successful submission
    document.getElementById("name").value = "";
    document.getElementById("price").value = "";
    document.getElementById("category").value = "";

    alert("Product added successfully!");
  } catch (error) {
    console.error("Error adding product:", error);
  }
}

async function showProducts() {
  const dataContainer = document.getElementById("data");

  try {
    const response = await fetch("/products");
    if (!response.ok) throw new Error("Failed to fetch products");

    const products = await response.json();

    // Render list to the DOM
    dataContainer.innerHTML = products.map(item => `
      <div>
        <strong>${item.name}</strong> - $${item.price} <em>(${item.category})</em>
      </div>
    `).join("");
  } catch (error) {
    console.error("Error fetching products:", error);
    dataContainer.textContent = "Unable to load products.";
  }
}
</script>

</body>
</html>

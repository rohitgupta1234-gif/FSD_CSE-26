<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form action="">
        <h4>Student Registration Form</h4>
        <label for="roll_no">Roll no :</label>
        <input type="text" src="roll_no">
        <br>

        <label for="Student_name">Student name :</label>
        <input type="text" placeholder="First name">
        <input type="text" placeholder="Last name">
        <br>

        <label for="Father_name">Father name name :</label>
        <input type="text" >
        <br>

        <label for="Date_of_birth">Date of birth</label>
        <input type="date">
        <br>
        <label for="mobile_no">Mobile no :</label>
        <input type="tel">
        <br>

        <label for="Email_id">Email id :</label>
        <input type="email">
        <br>

        <label for="password">Password :</label>
        <input type="password">
        <br>

        <label for="Gender">Gender :</label>
        <input type="radio">
        <label for="Male">Male</label>
        <input type="radio">
        <label for="Female">Female</label>
        <br>

        <label for="Department">Department</label>
        <input type="checkbox">
        <label for="">CSE</label>
        <input type="checkbox">
        <label for="">IT</label>
        <input type="checkbox">
        <label for="">ECE</label>
        <input type="checkbox">
        <label for="">Civil</label>
        <input type="checkbox">
        <label for="">Mech</label>
        <br>

        <label for="Course">Course :</label>
        <input type="text" placeholder="----Select Created Course's----">
        <br>

        <label for="">Student Photo :</label>
        <input type="file">
        <br>

        <label for="">City :</label>
        <input type="text">
         <br>
         
        <label for="">Address :</label>
        <input type="text" aria-rowspan="10" aria-colspan="3">
        <br>

        <input type="submit" >



    </form>
</body>
</html>
